[env]
term = "xterm-256color"

# TODO: Remember on a new machine to install alacritty themes
[general]
import = [
  # "~/.config/alacritty/active-theme.toml"
  "~/.config/alacritty/themes/themes/nord.toml"
  # "~/.config/alacritty/themes/themes/rose_pine_dawn.toml"
  # "~/.config/alacritty/themes/themes/andromeda.toml"
]

# NOTE: Assuming you're on a Debian-ish system
[bell]
command = { program = "paplay", args = ["/usr/share/sounds/freedesktop/stereo/bell.oga"] }

# optional: also flash the window briefly
duration = 150
color = "#ffffff"
animation = "EaseOutExpo"

# NOTE: Remember to install this font, or find another one you like;
# Source Code Pro is nice too
[font]
normal = { family = "Commit Mono Nerd Font", style = "Regular" }
bold = { family = "Commit Mono Nerd Font", style = "Bold" }
italic = { family = "Commit Mono Nerd Font", style = "Italic" }
bold_italic = { family = "Commit Mono Nerd Font", style = "Bold Italic" }

size = 13
# size = 14.0  # 111 x 62
# size = 13.0  # 118 x 66
# size = 12.0  # 135 x 74

[mouse]
hide_when_typing = true

# I think I put these in for the sake of tmux? I don't remeber
[keyboard]
bindings = [
  { key = "Tab",   mods = "Control",       chars = "\u001b[9;5u" },
  { key = "Tab",   mods = "Control|Shift", chars = "\u001b[9;6u" },
  { key = "Enter", mods = "Shift",         chars = "\u001b[13;2u" },
]

