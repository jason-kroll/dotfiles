# Reconsider Meta-arrows and Ctrl-arrows

# True color etc. Sync reduces tearing when an agent TUI redraws a lot,
# hyperlinks makes OSC 8 links clickable, and usstyle enables undercurl in
# Neovim.
set -as terminal-features ',alacritty:RGB:clipboard:hyperlinks:usstyle:sync'

set -g set-clipboard on        # lets programs in panes copy to the system clipboard (OSC 52)
set -g history-limit 50000     # default is 2000 lines; agents blow through that quickly

# Label each pane so you can tell planner from reviewer
set -g pane-border-status off  # maybe not this is irksome
set -g pane-border-format ' #{pane_index} #{pane_title} '

# Flag windows that ring the terminal bell (e.g. Vibe's "needs approval" bell)
# in the status bar, and pop a message when any window bells.
set -g bell-action any
set -g monitor-bell on
set-hook -g alert-bell 'display-message "bell in #{window_name} (#{pane_title})"'

# Recommended for LLM TUIs
set -g extended-keys on
# set -g extended-keys-format csi-u

# Leader key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g focus-events on

set -g mode-keys vi
set -g status-keys emacs
set -g escape-time 20

set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind R source-file ~/.tmux.conf \; display "Reloaded conf!"

unbind c
bind c new-window -c "#{pane_current_path}"

bind H split-window -fhb -c "#{pane_current_path}"
bind J split-window -fv -c "#{pane_current_path}"
bind K split-window -fvb -c "#{pane_current_path}"
bind L split-window -fh -c "#{pane_current_path}"

# Using vim meanings of vertical and horizontal
bind -n M-s split-window -v -c "#{pane_current_path}"

# Let's turn this off for more Emacs / Readline bindings
# bind -n M-v split-window -h -c "#{pane_current_path}"

bind \- split-window -v -c "#{pane_current_path}"
bind \| split-window -h -c "#{pane_current_path}"

# Let's train ourselves out of this one
bind -n C-M-p select-window -t :-
bind -n C-M-n select-window -t :+

# Let's see if we can get tabs working
bind-key -n C-Tab next-window
bind-key -n C-S-Tab previous-window

# # THIS interferes with Spacemacs window selection
# # This is just faster, also similar to web browsers
# bind -n M-1 select-window -t 1
# bind -n M-2 select-window -t 2
# bind -n M-3 select-window -t 3
# bind -n M-4 select-window -t 4
# bind -n M-5 select-window -t 5
# bind -n M-6 select-window -t 6
# bind -n M-7 select-window -t 7
# bind -n M-8 select-window -t 8
# bind -n M-9 select-window -t 1\; select-window -t -1

bind-key -n M-\\ last-window

# bind -n C-t new-window
bind -n C-PgDn next-window
bind -n C-PgUp previous-window
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# If inside an editor (nvim/emacs), pass C-hjkl through to it; otherwise select-pane
# (this was previously dead because the plain bind -n C-hjkl binds below overrode it)
is_editor="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|emacs(client)?)(diff)?$'"

bind -n C-h if-shell "$is_editor" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_editor" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_editor" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_editor" 'send-keys C-l' 'select-pane -R'

bind-key -n M-o select-pane -t :.+
bind-key -n M-O select-pane -t :.-

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Disabled so the is_editor passthrough above wins when nvim/emacs is running;
# at a shell prompt C-hjkl still do select-pane via those same conditional binds.
# bind -n C-h select-pane -L
# bind -n C-j select-pane -D
# bind -n C-k select-pane -U
# bind -n C-l select-pane -R

# So we can still pass through
bind C-h send-keys C-h
bind C-j send-keys C-j
bind C-k send-keys C-k
bind C-l send-keys C-l

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-\{ swap-pane -U
bind -n M-\} swap-pane -D

bind -n M-H resize-pane -L 10
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 10

bind -n M-z resize-pane -Z

# set -g status-justify absolute-centre

set -g status-bg color139

set -g pane-active-border-style 'fg=colour111,bold'  # a nice light blue
# set -g pane-border-style 'fg=colour238'

# set -g pane-active-border-style 'fg=colour46,bold'
# set -g pane-border-style 'fg=colour238'

# set -g pane-active-border-style 'fg=colour46'
set -g pane-border-style 'fg=colour238'
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'
